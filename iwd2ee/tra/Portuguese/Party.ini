[Party 5]

Name = As Mãos da Fúria
Descr1 =Um grupo de aventureiros desagradáveis da Costa da Espada, as Mãos da Fúria têm o hábito de intimidar e maltratar as pessoas que encontram pelo caminho.  Depois de viajarem a Luskan com um bando de piratas, a expedição que planejavam com a tripulação fracassou.  Presos em Luskan, decidiram buscar fortuna junto às levas de mercenários enviadas para ajudar Targos.  Seu líder autoritário, Makados, deu nome ao grupo.
Descr2 =Makados (Caótico e Mau, Masculino, Humano, Clérigo - Senhor da Tempestade de Talos): FOR: 14, DES: 12, CON: 10, INT: 10, SAB: 14, CAR: 16, Perícias: Blefe (2), Intimidar (1), Talentos: Vitalidade, Arma Simples: Maça.
Descr3 =Dahel Quatro-Sangrento (Caótico e Mau, Masculino, Humano, Bárbaro): FOR: 16, DES: 16, CON: 18, INT: 8, SAB: 10, CAR: 8, Perícias: Intimidar (2), Conhecimento da Natureza (4), Talentos: Esquiva, Arma Marcial: Machado.
Descr4 =Amraith (Neutro e Mau, Masculino, Elfo da Lua, Guerreiro): FOR: 10, DES: 20, CON: 10, INT: 14, SAB: 14, CAR: 8, Perícias: Intimidar (4), Conhecimento (Arcano) (2), Conhecimento da Natureza (2), Talentos: Ambidestria, Combate com Duas Armas.
Descr5 =Mirai Wainwright (Caótica e Neutra, Feminino, Meio-elfa, Maga): FOR: 10, DES: 14, CON: 14, INT: 18, SAB: 10, CAR: 10, Perícias: Alquimia (4), Concentração (4), Esconder-se (2), Conhecimento de Magia (4), Talentos: Tiro Rápido, Arma Simples: Projétil.
Descr6 =Harbesh Carver (Neutro, Masculino, Anão do Escudo, Ladino): FOR: 16, DES: 10, CON: 18, INT: 14, SAB: 10, CAR: 8, Perícias: Desarmar Armadilha (4), Esconder-se (4), Mover-se Silenciosamente (4), Abrir Fechadura (4), Furtar (4), Procurar (4), Talentos: Arma Simples: Lâmina Pequena.
Descr7 =Fissera (Neutro e Mau, Masculino, Humano, Druida): FOR: 10, DES: 10, CON: 10, INT: 16, SAB: 16, CAR: 14, Perícias: Empatia Animal (4), Blefe (2), Concentração (4), Diplomacia (4), Intimidar (2), Procurar (1), Conhecimento de Magia (4), Conhecimento da Natureza (4), Talentos: Sorte dos Heróis, Arma Simples: Projétil.
Descr8 =Makados, um orgulhoso Senhor da Tempestade de Talos, é uma figura intimidadora e carismática.  Embora seja sacerdote, está perfeitamente apto para o combate na linha de frente.  Isso é bom, já que Makados costuma arrumar briga com as pessoas que o grupo encontra.  Dahel Quatro-Sangrento, um bárbaro das Terras Centrais Ocidentais, é ainda mais sanguinário que Makados.  Embora seja meio lento e não particularmente forte para um bárbaro, sua velocidade e resistência incrível fazem dele um oponente perigoso.  Ganhou o apelido numa briga de taverna em que matou quatro adversários por pura maldade, depois de já tê-los espancado até a inconsciência.  O nobre elfo despossuído Amraith é um guerreiro frio e eficiente.  Mais rápido que qualquer outro membro das Mãos da Fúria, costuma ser o último de pé no fim de suas "disputas".  Também tem a mente ágil, o que o torna um pouco mais versátil que o simplório Dahel.  Mirai Wainwright é a única mulher das Mãos da Fúria, mas sua posição de única conjuradora arcana do grupo a torna bastante valiosa.  Meio-elfa, ela não tem a velocidade espantosa de Amraith, mas também não sofre da fragilidade dele.  É bastante inteligente, determinada e, surpreendentemente, forte fisicamente.  O outro excluído despossuído do grupo, Harbesh Carver, é um ladino anão competente e um brutamontes completo.  Forte, esperto e resistente, deixa a conversa para Makados e os outros.  É um sujeito ranzinza que se afeiçoa mais a uma fechadura difícil do que a um estranho simpático.  O último membro do grupo, Fissera, é um druida raivoso e agressivo, um péssimo companheiro para Makados.  Sábio e profundo das piores maneiras, Fissera espera o sinal de Makados e então libera a pior fúria da natureza sobre quem estiver no caminho.  Ao contrário de Makados e do resto da "linha de frente", Fissera não se considera particularmente adequado para o combate corpo a corpo.
