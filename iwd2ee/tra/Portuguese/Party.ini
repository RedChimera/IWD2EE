[Party 0]
Name = Novo Grupo
Descr1 = Comece o jogo criando seu próprio grupo.
Descr2 = Um grupo equilibrado tem pelo menos dois guerreiros (paladino, ranger, guerreiro e/ou bárbaro) para segurar a linha de frente, um clérigo ou druida para curar, um ladino para detectar armadilhas e abrir fechaduras, e um feiticeiro ou mago para causar dano em área.
Descr3 = Pressione Concluído para criar seus personagens, ou escolha um grupo na lista à esquerda.

[Party 1]
Name=Lamento da Dama
Descr1=O Lamento da Dama é um grupo de aventureiros vindo da Cidade dos Esplendores, Águas Profundas.  Eles têm fama de falar baixo, serem reservados e um tanto melancólicos.  Mesmo assim, são conhecidos por defender os mais fracos e costumam aceitar missões difíceis que outros grupos recusam.  Ao saber da sitiada cidade de Targos, viajaram depressa para Luskan e se juntaram às multidões de mercenários a caminho do Vale do Vento Gélido.  O grupo leva o nome de sua líder, Sheris, a Lirista.
Descr2=Sheris (Caótica e Boa, Feminino, Humana, Barda): FOR: 12, DES: 14, CON: 10, INT: 14, SAB: 10, CAR: 16, Perícias: Blefe (4), Esconder-se (4), Concentração (4), Diplomacia (4), Mover-se Silenciosamente (2), Talentos: Magocracia Cortês, Esquiva.
Descr3=Geldin (Leal e Neutro, Masculino, Meio-orc, Guerreiro): FOR: 20, DES: 16, CON: 16, INT: 8, SAB: 8, CAR: 6, Perícias: Intimidar (4), Mover-se Silenciosamente (3), Talentos: Ambidestria, Combate com Duas Armas.
Descr4=Khatja (Caótica e Boa, Feminino, Meio-orc, Bárbara): FOR: 18, DES: 14, CON: 14, INT: 10, SAB: 12, CAR: 6, Perícias: Intimidar (4), Conhecimento da Natureza (4), Talentos: Arma Marcial: Montante.
Descr5=Laeris (Leal e Bom, Masculino, Humano, Clérigo - Portador da Dor de Ilmater): FOR: 12, DES: 12, CON: 12, INT: 12, SAB: 16, CAR: 12, Perícias: Concentração (4), Conhecimento (Arcano) (4), Conhecimento de Magia (2), Talentos: Magia em Combate, Vitalidade.
Descr6=Vraedna (Caótica e Neutra, Feminino, Drow, Feiticeira): FOR: 10, DES: 14, CON: 14, INT: 16, SAB: 10, CAR: 16, Perícias: Alquimia (4), Concentração (4), Conhecimento (Arcano) (4), Conhecimento de Magia (4), Talentos: Magia em Combate.
Descr7=Kylie (Neutro e Bom, Masculino, Halfling Pé-Leve, Ladino): FOR: 12, DES: 20, CON: 12, INT: 12, SAB: 10, CAR: 10, Perícias: Desarmar Armadilha (4), Esconder-se (4), Mover-se Silenciosamente (4), Abrir Fechadura (4), Furtar (4), Procurar (4), Talentos: Arma Marcial: Arco.
Descr8=Sheris era a filha mimada de um nobre de Águas Profundas.  Aproveitava a riqueza e o poder da família para levar uma vida de luxo e ociosidade.  Seu único amor verdadeiro era a música, e era nisso que tentava se destacar.  Sheris fugiu de casa ao descobrir que o pai havia arranjado seu casamento.  Sem aptidão para qualquer outra profissão, tornou-se barda.  Geldin e Khatja, um casal de meio-orcs, são os músculos do Lamento da Dama.  Geldin segue o caminho disciplinado do guerreiro, enquanto Khatja acredita na ferocidade e no caos do bárbaro.  Juntos, formam uma força poderosa.  Nenhum dos dois fala muito do passado; dizem apenas que não são aceitos nem por orcs, nem por humanos.  Laeris, o clérigo de Ilmater, é a força espiritual que guia o grupo.  É um homem humilde que fala pouco e pede menos ainda.  Muitas vezes usa sua grande sabedoria para complementar o carisma de Sheris.  Vraedna, a feiticeira, é o poder arcano do grupo.  Donzela drow, ela renegou o culto a Lolth e fugiu do Underdark.  Fica com o Lamento da Dama na esperança de compartilhar sua boa reputação.  Seu maior medo é ser abandonada e ficar sozinha no mundo da superfície.  Kylie, o ladino halfling, é o brincalhão do grupo.  Seu objetivo de vida é tirar a cara feia dos companheiros ou, pelo menos, fazê-los rir de vez em quando.  Depois de vários anos com o Lamento da Dama, ele entende muito bem o ditado "a desgraça adora companhia".
