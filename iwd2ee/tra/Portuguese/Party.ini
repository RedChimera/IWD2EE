[Party 3]
Name= A Rosa do Inverno
Descr1=Batizada em homenagem à Rosa-do-Gelo, cujas pétalas continuam carmesins mesmo nos climas mais rigorosos, esta irmandade se baseia num compromisso inabalável com o dever.  Assim como é dever da Rosa-do-Gelo manter seu tom escarlate contra as terras cobertas de neve, os membros da Rosa do Inverno devem honrar seu pacto como guardiões autoproclamados do Norte.
Descr2=O Vigia (Leal e Bom, Masculino, Aasimar, Paladino de Helm): FOR: 16, DES: 10, CON: 12, INT: 10, SAB: 14, CAR: 18, Perícias: Concentração (1), Diplomacia (3), Talentos: Sorte dos Heróis.
Descr3=Kebb Trapmaster (Neutro e Bom, Masculino, Gnomo das Rochas, Ladino): FOR: 10, DES: 18, CON: 12, INT: 14, SAB: 12, CAR: 10, Perícias: Desarmar Armadilha (4), Esconder-se (4), Mover-se Silenciosamente (4), Abrir Fechadura (4), Furtar (4), Procurar (4), Talentos: Tiro Rápido.
Descr4=Tianya (Neutra e Boa, Feminino, Meio-elfa, Druida): FOR: 12, DES: 12, CON: 12, INT: 10, SAB: 18, CAR: 12, Perícias: Empatia Animal (4), Conhecimento da Natureza (4), Talentos: Arma Simples: Projétil (2).
Descr5=Naleen (Leal e Boa, Feminino, Tiefling, Monja dos Quebrados): FOR: 14, DES: 16, CON: 12, INT: 10, SAB: 18, CAR: 8, Perícias: Esconder-se (4), Mover-se Silenciosamente (4), Talentos: Esquiva.
Descr6=Llendril Coe (Neutra e Boa, Feminino, Elfa da Lua, Barda): FOR: 10, DES: 14, CON: 12, INT: 12, SAB: 12, CAR: 16, Perícias: Alquimia (4), Blefe (3), Concentração (2), Conhecimento (Arcano) (3) Talentos: Canção Persistente.
Descr7=Dalwynd Meadsbreath (Caótico e Bom, Masculino, Halfling Pé-Leve, Mago): FOR: 8, DES: 14, CON: 12, INT: 18, SAB: 10, CAR: 14, Perícias: Alquimia (4), Concentração (4), Diplomacia (2), Conhecimento (Arcano) (4), Conhecimento de Magia (4), Talentos: Arma Simples: Besta, Foco em Magia: Encantamento (1).
Descr8=O Vigia, Sirge de La Sunya de Amn, é o fundador da irmandade.  Seu pai, Don Di'Armos, era um nobre respeitado e Vigia de Helm na cidade de Athkatla.  No leito de morte, o Don contou ao filho sobre uma irmã que ele tinha na distante terra de Damara.  Durante uma expedição muito longa e solitária, o Don encontrou companhia numa mulher estranha nas terras selvagens.  Quando a mulher deu à luz a criança dos dois, revelou ser um demônio.  Don Di'Armos destruiu o demônio, mas não teve coragem de matar uma criança, mesmo uma criança demoníaca.  Levou a abominação a um mosteiro e a deixou aos cuidados dos monges.  A revelação fez Sirge questionar tudo em que sempre havia acreditado.  Ele abandonou seus deveres para com a igreja e para com a Casa de La Sunya, decidido a procurar a irmã.  Kebb Trapmaster é o escudeiro do Vigia.  Ganhou seu nome como membro da infame Guilda dos Ladrões das Sombras. Incomodado com a tendência dos Ladrões das Sombras para matar, considerou uma bênção quando foi condenado à servidão por contrato.  Mais do que um simples escudeiro, Kebb é professor e melhor amigo de Sirge. Naturalmente, acompanhou o cavaleiro quando ele deixou Amn.  Tianya é uma bela druida meio-elfa. Foi deixada à mercê da natureza ainda criança, abandonada por pais que queriam evitar que ela estragasse suas vidas "perfeitas".  Entrou para a irmandade por acaso. Sirge encontrou a irmã, a tiefling Naleen, no Mosteiro da Rosa Amarela.  Não teve coragem de revelar o verdadeiro laço entre eles.  Então se apresentou como "O Vigia" e a convidou a entrar para a Rosa do Inverno.  Com um profundo desejo de conhecer o mundo além dos muros do mosteiro, ela aceitou.  Llendril e Dalwynd são os membros mais novos da Rosa do Inverno.  Llendril descende dos Elfos da Mão. Decidiu voltar ao lar ancestral, na esperança de encher os salões outrora belos com a música que nasceu ali. Dalwynd era o maior ladrão de tortas de seu vilarejo.  Desde pequeno, conseguia escapar na conversa de situações das quais a maioria dos halflings precisava escapar às escondidas.  Quando Dalwynd deixou seu Condado na companhia desses aventureiros, seria de se esperar que o povo pequeno do Condado ficasse feliz em ver o pequeno contrabandista de tortas partir, mas, como sempre acontece com a família, sentem mais falta dele do que sentiam das tortas.  Os dois fizeram muito para alegrar o coração deste bando de aventureiros.
