[Party 4]
Name=Anais de Halgren
Descr1=Este bando cansado surgiu à sombra de Halgren Death's Head, um anão do Clã Bruenghor, das Montanhas do Pôr do Sol, uma cordilheira muito ao sul do Vale do Vento Gélido.  Seu líder, Halgren, busca riqueza suficiente para apagar do nome da família a mancha dos crimes sangrentos de um de seus ancestrais, um anão cruel conhecido como Kaervas.  O grupo se reuniu em Luskan há pouco mais de uma dezena de dias.  Nem maus, nem especialmente obedientes à lei, eles costumam honrar a palavra e se manter fiéis à sua causa, que é engrandecer o próprio nome... e apagar a mancha do nome de Halgren.
Descr2=Halgren Death's Head (Leal e Neutro, Masculino, Anão do Escudo, Guerreiro): FOR: 18, DES: 14, CON: 14, INT: 10, SAB: 8, CAR: 12, Perícias: Intimidar (4), Talentos: Trespassar, Ataque Poderoso.
Descr3=Bastinado (Caótico e Neutro, Masculino, Humano, Ranger): FOR: 18, DES: 14, CON: 14, INT: 10, SAB: 10, CAR: 10, Perícias: Empatia Animal (4), Esconder-se (2), Conhecimento da Natureza (4), Talentos: Arma Marcial: Arco, Arma Marcial: Montante.
Descr4=Alia Donzela-do-Escudo (Neutra, Feminino, Anã do Escudo, Clériga - Guarda de Batalha de Tempus): FOR: 16, DES: 12, CON: 12, INT: 10, SAB: 18, CAR: 8, Perícias: Concentração (4), Talentos: Magia em Combate.
Descr5=Silêncio-Antes-do-Ferro (Leal e Neutra, Feminino, Tiefling, Monja da Ordem Antiga): FOR: 16, DES: 20, CON: 12, INT: 10, SAB: 16, CAR: 4, Perícias: Mover-se Silenciosamente (4), Talentos: Ataque Poderoso.
Descr6=Mordakai de Thay (Leal e Neutro, Masculino, Humano, Feiticeiro): FOR: 10, DES: 10, CON: 12, INT: 14, SAB: 12, CAR: 18, Perícias: Alquimia (4), Concentração (4), Diplomacia (2), Conhecimento (Arcano) (4), Talentos: Magia em Combate, Foco em Magia: Evocação.
Descr7=Kei, o Ídolo de Madeira (Caótica e Neutra, Feminino, Meio-elfa, Ladina): FOR: 12, DES: 18, CON: 12, INT: 12, SAB: 10, CAR: 12, Perícias: Desarmar Armadilha (4), Esconder-se (4), Mover-se Silenciosamente (4), Abrir Fechadura (4), Procurar (4), Talentos: Arma Marcial: Arco.
Descr8=Halgren Death's Head, o líder do grupo, é um guerreiro anão de habilidade impressionante com o machado e a besta; sua força e resistência permitem que ele seja, sozinho, uma linha de frente inteira.  É assombrado pelos crimes de seu ancestral, que segundo os boatos era um anão sombrio, e vive tentando acumular riqueza (e fama) para redimir o nome da família.  Bastinado diz ter vagado por todos os Reinos como pirata, pescador, mercenário, funileiro, batedor e guarda-florestal.  É hábil com todo tipo de arma, e sua grande força, resistência e bom humor, qualquer que seja a situação, são a cola que manteve o bando unido na longa jornada desde Luskan. Quando a batalha chama, ele assume o flanco esquerdo de Halgren nos confrontos, protegendo seu líder.  A esposa de Halgren, Alia Donzela-do-Escudo, viaja com ele há quase uma década e trocou os deuses anões por Tempus, emprestando seus poderes clericais à causa de Halgren.  Ela acredita que o caminho do bando será sangrento e mantém um diário de suas viagens. Quando as lâminas são sacadas, ela costuma cobrir o flanco direito de Halgren, o que lhe valeu o nome "Donzela-do-Escudo".  Silêncio-Antes-do-Ferro é uma monja de Amn.  Traz em si o toque dos planos inferiores, e seus votos monásticos e o sangue demoníaco a fazem ser reservada.  Silêncio-Antes-do-Ferro segue uma ordem de monges que empunham ideais no lugar de armas, abraçando aspectos como o silêncio, a sombra, o gelo, o medo ou o vento antes do ferro de uma maça ou do gume de uma espada.  Mordakai de Thay deu as costas aos parentes thayanos e fugiu para o norte e o oeste depois que seus poderes de feiticeiro foram descobertos pelos colegas Magos Vermelhos.  Abandonando o aprendizado, o feiticeiro aceitou de bom grado uma jornada ao Norte, onde sentia que poderia se sentir em casa entre o gelo e a neve.  É bem menos sanguinário que os outros Magos Vermelhos e vive tentando se diferenciar deles pelas próprias ações.  Kei, o Ídolo de Madeira, afirma que um dia foi apenas uma escultura de madeira que ganhou vida e se tornou uma mulher de carne e osso - uma de suas muitas histórias que costuma provocar sobrancelhas erguidas numa refeição de taverna, já que suas orelhas revelam sangue élfico.  É uma ladina simpática, sempre pronta com uma piada - ou para forçar uma fechadura, ou para sair escondida à noite e espiar o que os mercadores ricos da região andam tramando.  Suas habilidades costumam mantê-la a uma distância discreta da linha de frente.
