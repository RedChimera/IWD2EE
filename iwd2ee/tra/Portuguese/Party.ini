[Party 2]
Name =Irmãs da Lua Rubra
Descr1 =Reunidas sob o olhar atento e acolhedor de Selune, mais pelas diferenças do que pelas semelhanças, as jovens aventureiras conhecidas como Irmãs da Lua Rubra fizeram de sua missão ajudar os oprimidos, os maltratados e quem mais precisa.  Sua líder, S'feria Ranul, uma drow Estrela Prateada de Selune que normalmente vive na cidade de Silverymoon, reuniu um dia suas irmãs de aventura e lhes mostrou o pedido de ajuda da atribulada cidade de Targos.  A promessa de ouro de Targos não foi o que motivou o grupo a ajudar.  Foi o laço entre elas e o juramento de ajudar todos que pedissem, e elas não hesitaram em fretar um navio para levar as Irmãs da Lua Rubra a Targos.

Descr2 =S'feria Ranul (Caótica e Boa, Feminino, Drow, Clériga - Estrela Prateada de Selune): FOR: 14, DES: 12, CON: 10, INT: 12, SAB: 18, CAR: 14, Perícias: Concentração (4), Diplomacia (4), Talentos: Arma Simples: Maça.
Descr3 =Oagla'ta (Caótica e Boa, Feminino, Meio-orc, Bárbara): FOR: 20, DES: 12, CON: 14, INT: 8, SAB: 10, CAR: 10, Perícias: Intimidar (4), Talentos: Arma Marcial: Machado.
Descr4 =Nyzeil Nighthammer (Caótica e Boa, Feminino, Anã Cinzenta, Guerreira): FOR: 18, DES: 12, CON: 16, INT: 10, SAB: 12, CAR: 6, Perícias: Intimidar (4), Talentos: Teimoso, Arma Marcial: Martelo.
Descr5 =Nevae Quar (Neutra e Boa, Feminino, Meio-elfa, Ranger): FOR: 14, DES: 16, CON: 12, INT: 10, SAB: 12, INT: 10, CAR: 12, Perícias: Empatia Animal (4), Conhecimento da Natureza (4), Talentos: Arma Marcial: Arco.
Descr6 =Hylei Shadowhand (Neutra e Boa, Feminino, Gnoma das Rochas, Ilusionista): FOR: 8, DES: 14, CON: 12, INT: 18, SAB: 12, CAR: 12, Perícias: Alquimia (4), Concentração (4), Esconder-se: (2), Conhecimento (Arcano) (4), Conhecimento de Magia (4), Talentos: Magia em Combate, Magocracia Cortês.
Descr7 =Kylei Shadowhand (Caótica e Boa, Feminino, Gnoma das Rochas, Ladina): FOR: 8, DES: 18, CON: 14, INT: 14, SAB: 10, CAR: 12, Perícias: Blefe (4), Desarmar Armadilha (4), Esconder-se (4), Abrir Fechadura (4), Furtar (4), Procurar (4), Talentos: Esquiva.
Descr8 ="Este não é um lugar adequado para um bando de damas."  Quantas vezes S'feria Ranul já tinha ouvido essa frase, e outras parecidas?  Mais do que gostaria de contar.  Mas quem dizia essas frases de alerta sabia pouco sobre S'feria e suas Irmãs da Lua Rubra.  Nascida na cidade de Sshamath, no Underdark, mas criada por elfos da lua na cidade de superfície de Silverymoon, S'feria Ranul cresceu e se tornou uma sacerdotisa de Selune sofisticada, determinada e atenciosa - também conhecida como Estrela Prateada de Selune.  Ela consegue ignorar a maioria dos comentários preconceituosos e mudar a opinião das pessoas em favor da aceitação e da tolerância.  Foram essas qualidades, e sua força de liderança, que reuniram outras mulheres de pensamento, tenacidade e força semelhantes para formar as Irmãs da Lua Rubra.  Oagla'ta é uma bárbara meio-orc de grande porte e força, mesmo comparada aos machos de sua raça.  Sua companheira, a anã cinzenta Nyzeil Nighthammer, é igualmente formidável entre os seus. No entanto, nenhuma das duas tinha o coração sombrio que sua herança costuma trazer.  As duas entraram para as Irmãs da Lua Rubra depois que S'feria, num ato de bondade, interveio contra o comportamento intolerante e preconceituoso dos guardas de Silverymoon em relação a elas.  Oagla'ta e Nyzeil são extremamente hábeis com machados e martelos de guerra, e costumam superar qualquer guerreiro de sua raça.  Nevae Quar é uma meio-elfa, arqueira talentosa e jovem ranger que fez amizade com duas gnomas gêmeas: Hylei Shadowhand, uma ilusionista que prefere enganar a ferir, e Kylei Shadowhand, uma ladina com queda para bater carteiras.  As três mulheres encontraram S'feria e sua trupe por acaso, quando S'feria, Oagla'ta e Nyzeil foram emboscadas por uma dúzia de goblins na floresta perto de Silverymoon.  Nevae e as amigas não hesitaram em ajudar as mulheres emboscadas assim que as encontraram.  Graças a Nevae e às gêmeas Shadowhand, a batalha terminou antes mesmo de começar de verdade, para decepção de Oagla'ta e Nyzeil.  Mesmo assim, S'feria ficou encantada com o entrosamento de todas na luta contra os goblins e soube que as Irmãs da Lua Rubra estariam completas com Nevae e as gêmeas Shadowhand - que ficaram radiantes com a chance de entrar para um grupo oficial de aventureiras.

